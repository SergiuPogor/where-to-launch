name: Suggest a place
description: Suggest a place to launch or share a product, without editing JSON.
title: "Add: "
labels: ["new place"]
body:
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link
      placeholder: https://
    validations:
      required: true
  - type: input
    id: description
    attributes:
      label: What is it, and who does it reach?
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Launch Platforms
        - Communities
        - Reddit
        - Directories
        - Deals
        - Marketplaces
    validations:
      required: true
